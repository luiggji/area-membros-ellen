name: Claude Review

# Revisão automática de qualidade + segurança a cada PR (complementa o CI, não substitui revisão humana).
# Ativação: criar o segredo CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`) ou ANTHROPIC_API_KEY no repositório.
# Sem segredo configurado o job termina sem falhar.
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verifica credencial
        id: creds
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH$API_KEY" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Claude Review desativado (sem segredo)."; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        if: steps.creds.outputs.enabled == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }} · PR #${{ github.event.pull_request.number }}

            Revise esta PR seguindo CLAUDE.md, .claude/agents/code-reviewer.md e .claude/agents/security-reviewer.md
            (e .claude/agents/ui-reviewer.md se houver mudança em apps/web ou packages/ui).

            Regras de saída (objetividade — não criar trâmite infinito):
            1. A PR resolve a Issue referenciada? Critérios de aceite atendidos? Escopo respeitado?
            2. Liste SOMENTE achados verificados, classificados como:
               - BLOQUEANTE: bug P0/P1, falha de segurança (authz, RLS/IDOR, webhook, segredo, XSS, injeção),
                 critério de aceite não atendido, quebra de contrato/migration destrutiva sem plano.
               - FOLLOW-UP: melhoria legítima fora do essencial → sugerir Issue com prioridade P0/P1/P2.
            3. Não comente estilo que o lint/formatter já cobre. Não peça refatorações fora do escopo.
            4. Termine com o veredito: APROVAR, APROVAR COM FOLLOW-UPS ou MUDANÇAS NECESSÁRIAS.
            Comentários inline só para BLOQUEANTES.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
