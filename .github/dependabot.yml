version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Majors entram por Issue planejada (ex.: NestJS 12 = CF-168; TypeScript 7 = ADR 0001).
    # Vulnerabilidade em major continua aparecendo nos alertas (aba Security) e no audit do CI.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: ['type:chore', 'dependencies']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: ['type:chore', 'dependencies']
