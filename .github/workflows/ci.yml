name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [develop, main]

# Princípio do menor privilégio: nenhum job tem escrita nem segredo de produção.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  branch-convention:
    name: branch-convention
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Valida tipo/<ISSUE>-slug, base correta e Issue referenciada
        run: node .github/scripts/check-branch-name.mjs
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}

  lint-and-typecheck:
    name: lint-and-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit-integration:
    name: unit-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  dependency-security:
    name: dependency-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Vulnerabilidades altas/críticas em dependências de produção
        run: pnpm audit --prod --audit-level high

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks (histórico da PR / push)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --redact --verbose --exit-code 1

  sast:
    name: sast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.181.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep (TypeScript, Node, Next, segredos, OWASP)
        run: |
          semgrep scan --error --metrics=off \
            --config p/typescript --config p/nodejs --config p/nextjs \
            --config p/secrets --config p/owasp-top-ten \
            --exclude docs --exclude supabase/config.toml

  # CF-016: o banco sobe do zero só com as migrations versionadas, em Postgres local do
  # Supabase dentro do runner. Sem projeto cloud e sem nenhuma chave (P-014 em aberto).
  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Regras das migrations (nome, destrutivas, RLS) e seeds fictícios
        run: |
          node --test .github/scripts/check-migrations.test.mjs .github/scripts/check-seeds.test.mjs supabase/scripts/seed-dev.test.mjs
          node .github/scripts/check-migrations.mjs
          node .github/scripts/check-seeds.mjs
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - name: Sobe o Postgres local e aplica as migrations do zero
        run: supabase db start
      - name: Reaplica tudo do zero com seeds (prova de repetibilidade)
        run: supabase db reset --local
      - name: Lint do schema (funções e SQL)
        run: supabase db lint --local --level error --fail-on error
      - name: Testes pgTAP (supabase/tests)
        run: supabase test db
      - name: Types do schema em dia (CF-156)
        run: |
          supabase gen types typescript --local --schema public > "$RUNNER_TEMP/database.types.ts"
          if ! diff -u packages/contracts/src/database.types.ts "$RUNNER_TEMP/database.types.ts"; then
            echo "::error file=packages/contracts/src/database.types.ts::Types desatualizados. Rode 'pnpm db:types' (exige Docker) ou copie o arquivo gerado abaixo."
            echo "----- gerado pelo CLI -----"
            cat "$RUNNER_TEMP/database.types.ts"
            exit 1
          fi
      - name: Resumo
        if: always()
        run: |
          {
            echo "### Banco (CF-016)"
            echo "Migrations aplicadas do zero em Postgres local:"
            for file in supabase/migrations/*.sql; do echo "- \`$(basename "$file")\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
