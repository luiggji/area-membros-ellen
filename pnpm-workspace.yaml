packages:
  - apps/*
  - packages/*

engineStrict: true

# Somente pacotes auditados podem rodar scripts de instalação (supply chain).
allowBuilds:
  unrs-resolver: true
  # usa binário pré-compilado; script de build desnecessário
  '@parcel/watcher': false

# Supply chain (semgrep): versões novas só após um período de quarentena; sem downgrade de
# confiança; sem deps transitivas vindas de git/tarball.
# 1 dia por enquanto: o lockfile inicial tem versões publicadas há < 7 dias. Subir para
# 10080 (7 dias) e remover o nosemgrep quando todas tiverem mais de uma semana — Issue #21.
minimumReleaseAge: 1440 # nosemgrep: package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age -- temporário, #21
trustPolicy: no-downgrade
# Versões antigas legítimas publicadas antes do npm ter provenance (falso positivo de downgrade).
trustPolicyExclude:
  - semver@6.3.1
  - eslint-import-resolver-typescript@3.10.1
blockExoticSubdeps: true

# Riscos aceitos no audit (CF-019, docs/runbooks/segredos.md §Riscos aceitos). Só entram aqui achados
# sem versão corrigida e fora do código de produção; revisar a cada atualização do Dependabot.
auditConfig:
  ignoreGhsas:
    # braces ≤3.0.3 (alta, DoS por padrão aninhado): só no lint do Next (fast-glob); sem correção.
    - GHSA-vfj7-8cjw-p6xm
    # sprintf-js ≤1.1.3 (moderada, DoS por precisão): só no Jest (istanbul/js-yaml); sem correção.
    - GHSA-hp3w-g68c-fv3c
